aid: harness-wealth
name: Harness Wealth
description: 'Harness — the company that launched as Harness Wealth, and today a wholly
  owned business of Multiplier, Inc. — is a New York City firm that runs an advisory
  platform for tax and wealth practices. It operates three connected surfaces: a marketplace
  that matches individuals with complex financial situations (equity compensation,
  liquidity events, business owners, real estate, high net worth) to vetted tax advisors;
  a client portal and workflow platform that tax firms run their engagements, documents,
  questionnaires and e-file on; and Harness Wealth Advisers, LLC, an SEC-registered
  investment adviser that recommends third-party advisers. Harness publishes no public
  developer program — there is no developer portal, API reference, OpenAPI/GraphQL/AsyncAPI
  specification, SDK, CLI or webhook documentation on any Harness host, and the product
  is delivered entirely as an end-user web application at app.harness.co.'
